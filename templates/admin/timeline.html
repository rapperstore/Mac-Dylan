<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Timeline — Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:wght@400;700&family=Cormorant+Garamond:ital,wght@0,300;0,400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--black:#050403;--deep:#080604;--ember:#c84b0a;--fire:#e8720c;--flame:#f5a623;--ash:#b8a898;--white:#f5f0e8;--muted:#7a6a5a;--card:#0f0c09;--card2:#160f0b;--border:#1e1a16;--borderl:#2a231e;--green:#3a8a5a;--red:#c84a4a}
body{background:var(--black);color:var(--white);font-family:'Cormorant Garamond',serif;display:flex;min-height:100vh}
a{color:inherit;text-decoration:none} button{cursor:pointer}
.sb{width:200px;min-height:100vh;background:var(--deep);border-right:1px solid var(--border);position:fixed;top:0;left:0;bottom:0;z-index:100;display:flex;flex-direction:column;overflow-y:auto}
.sb-logo{padding:20px;border-bottom:1px solid var(--border);font-family:'Bebas Neue',sans-serif;font-size:17px;letter-spacing:.1em}.sb-logo span{color:var(--fire)}
.sb-sub{font-family:'Space Mono',monospace;font-size:7px;letter-spacing:.3em;color:var(--muted);text-transform:uppercase;margin-top:2px}
.sb-nav{flex:1;padding:12px 0}
.sb-grp{font-family:'Space Mono',monospace;font-size:7px;letter-spacing:.4em;color:var(--muted);text-transform:uppercase;padding:10px 18px 4px}
.sb-item{display:flex;align-items:center;gap:8px;padding:9px 18px;font-family:'Space Mono',monospace;font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);transition:all .15s;border-left:2px solid transparent}
.sb-item:hover{color:var(--white);background:rgba(200,75,10,.05)}
.sb-item.on{color:var(--fire);border-left-color:var(--ember);background:rgba(200,75,10,.06)}
.sb-foot{padding:14px 18px;border-top:1px solid var(--border)}
.sb-foot a{font-family:'Space Mono',monospace;font-size:7px;letter-spacing:.2em;color:var(--muted);text-transform:uppercase}.sb-foot a:hover{color:var(--fire)}
.main{margin-left:200px;flex:1;display:flex;flex-direction:column}
.topbar{padding:14px 28px;background:var(--deep);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:50}
.topbar-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:.06em}
.content{padding:28px;flex:1;max-width:760px}
.sec{font-family:'Space Mono',monospace;font-size:7px;letter-spacing:.5em;color:var(--ember);text-transform:uppercase;margin-bottom:12px;display:flex;align-items:center;gap:8px}.sec::after{content:'';flex:1;height:1px;background:var(--border)}
.composer{background:var(--card);border:1px solid var(--border);padding:18px;margin-bottom:26px}
.ta{width:100%;background:var(--deep);border:1px solid var(--border);color:var(--white);font-family:'Cormorant Garamond',serif;font-size:16px;line-height:1.6;padding:12px 14px;resize:vertical;min-height:96px;transition:border-color .2s}
.ta:focus{outline:none;border-color:var(--ember)}
.fi{width:100%;padding:8px 10px;background:var(--deep);border:1px solid var(--border);color:var(--white);font-family:'Space Mono',monospace;font-size:11px;transition:border-color .2s}
.fi:focus{outline:none;border-color:var(--ember)}
.lbl{font-family:'Space Mono',monospace;font-size:7px;letter-spacing:.3em;color:var(--muted);text-transform:uppercase;margin:12px 0 4px;display:block}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:7px;font-family:'Space Mono',monospace;font-size:8px;letter-spacing:.16em;color:var(--ash);text-transform:uppercase}
.chk input{accent-color:var(--ember)}
.count{font-family:'Space Mono',monospace;font-size:9px;color:var(--muted)}
.count.over{color:var(--red)}
.btn{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:.2em;text-transform:uppercase;padding:9px 18px;border:none;transition:all .2s;cursor:pointer}
.btn-f{background:var(--ember);color:var(--white)}.btn-f:hover{background:var(--fire)}
.btn-f:disabled{opacity:.45;cursor:not-allowed}
.btn-g{background:transparent;border:1px solid var(--borderl);color:var(--muted)}.btn-g:hover{border-color:var(--ember);color:var(--fire)}
.btn-d{background:transparent;border:1px solid rgba(200,74,74,.3);color:var(--red)}.btn-d:hover{background:var(--red);color:var(--white)}
.btn-sm{padding:5px 10px;font-size:7px}
.post{background:var(--card);border:1px solid var(--border);padding:16px 18px;margin-bottom:12px}
.post.pinned{border-color:rgba(200,75,10,.4);background:rgba(200,75,10,.04)}
.p-top{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.p-date{font-family:'Space Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:.1em}
.badge{font-family:'Space Mono',monospace;font-size:7px;letter-spacing:.2em;text-transform:uppercase;padding:2px 7px;border:1px solid}
.b-on{color:var(--green);border-color:var(--green)}.b-off{color:var(--muted);border-color:var(--borderl)}
.b-pin{color:var(--fire);border-color:var(--ember)}
.p-body{font-size:15px;color:var(--ash);line-height:1.6;white-space:pre-wrap;word-wrap:break-word}
.p-img{margin-top:10px;max-width:220px;border:1px solid var(--border)}
.p-img img{width:100%;display:block}
.p-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;flex-wrap:wrap}
.p-likes{font-family:'Space Mono',monospace;font-size:9px;color:var(--fire);letter-spacing:.12em}
.p-acts{display:flex;gap:6px;flex-wrap:wrap}
.empty{text-align:center;padding:26px;color:var(--muted);font-style:italic;font-size:13px;background:var(--card);border:1px solid var(--border)}
.alert{padding:8px 12px;font-family:'Space Mono',monospace;font-size:8px;letter-spacing:.15em;margin-bottom:12px;display:none}
.a-ok{background:rgba(58,138,90,.1);border:1px solid var(--green);color:var(--green);display:block}
.a-err{background:rgba(200,74,74,.1);border:1px solid var(--red);color:var(--red);display:block}
.hbtn{display:none}.sb-backdrop{display:none}
@media(max-width:900px){
  .sb{transform:translateX(-100%);transition:transform .25s ease;z-index:200;box-shadow:8px 0 32px rgba(0,0,0,.5)}
  .sb.open{transform:translateX(0)}
  .main{margin-left:0}
  .hbtn{display:flex;align-items:center;justify-content:center;width:34px;height:34px;background:transparent;border:1px solid var(--borderl);color:var(--white);font-size:15px;cursor:pointer;flex-shrink:0;margin-right:10px}
  .sb-backdrop{display:block;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:150;opacity:0;pointer-events:none;transition:opacity .2s}
  .sb-backdrop.show{opacity:1;pointer-events:auto}
  .content{padding:14px}.row{grid-template-columns:1fr}
}
</style>
</head>
<body>
<aside class="sb">
  <div class="sb-logo">Mac<span>Dylan</span><div class="sb-sub">Admin</div></div>
  <nav class="sb-nav">
    <div class="sb-grp">Overview</div>
    <a href="/admin/" class="sb-item"><span>◈</span>Dashboard</a>
    <a href="/admin/orders" class="sb-item"><span>◻</span>Orders</a>
    <div class="sb-grp">Music</div>
    <a href="/admin/beats" class="sb-item"><span>♩</span>Beats</a>
    <a href="/admin/music" class="sb-item"><span>♫</span>Music &amp; Albums</a>
    <div class="sb-grp">Store</div>
    <a href="/admin/products" class="sb-item"><span>◈</span>Products</a>
    <a href="/admin/content" class="sb-item"><span>▶</span>Content</a>
    <div class="sb-grp">Audience</div>
    <a href="/admin/timeline" class="sb-item on"><span>✎</span>Timeline</a>
    <a href="/admin/subscribers" class="sb-item"><span>✉</span>Subscribers</a>
    <a href="/admin/leads" class="sb-item"><span>📱</span>Phone Leads</a>
    <div class="sb-grp">Account</div>
    <a href="/admin/logout" class="sb-item"><span>→</span>Log Out</a>
  </nav>
  <div class="sb-foot"><a href="/#updates" target="_blank">← View Timeline</a></div>
</aside>
<div class="sb-backdrop" onclick="toggleSidebar()"></div>
<div class="main">
  <div class="topbar">
    <div style="display:flex;align-items:center">
      <button class="hbtn" onclick="toggleSidebar()" aria-label="Menu">☰</button>
      <div class="topbar-title">Timeline</div>
    </div>
    <a href="/#updates" target="_blank" class="btn btn-g">View on Site</a>
  </div>
  <div class="content">
    <div id="a-msg" class="alert"></div>

    <div class="sec">New Post</div>
    <div class="composer">
      <textarea class="ta" id="p-body" placeholder="What's happening? Studio update, new drop, session news…" oninput="updateCount()"></textarea>
      <div class="row">
        <div><label class="lbl">Image URL (optional)</label><input class="fi" id="p-img" placeholder="https://...r2.dev/photo.jpg"></div>
        <div><label class="lbl">Link (optional)</label><input class="fi" id="p-link" placeholder="https://..."></div>
      </div>
      <div class="cbar">
        <div style="display:flex;gap:16px;flex-wrap:wrap">
          <label class="chk"><input type="checkbox" id="p-pub" checked> Publish now</label>
          <label class="chk"><input type="checkbox" id="p-pin"> Pin to top</label>
        </div>
        <div style="display:flex;align-items:center;gap:12px">
          <span class="count" id="p-count">0 / 1000</span>
          <button class="btn btn-f" id="p-btn" onclick="addPost()">Post</button>
        </div>
      </div>
    </div>

    <div class="sec">Posts</div>
    <div id="posts"><div class="empty">Loading…</div></div>
  </div>
</div>

<script>
function toggleSidebar(){document.querySelector('.sb').classList.toggle('open');document.querySelector('.sb-backdrop').classList.toggle('show');}
function msg(t,m){var a=document.getElementById('a-msg');a.textContent=m;a.className='alert '+(t==='ok'?'a-ok':'a-err');setTimeout(function(){a.className='alert';},4000);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function updateCount(){
  var n=document.getElementById('p-body').value.length;
  var el=document.getElementById('p-count');
  el.textContent=n+' / 1000';
  el.className='count'+(n>1000?' over':'');
  document.getElementById('p-btn').disabled = n===0 || n>1000;
}
function load(){
  fetch('/admin/posts').then(r=>r.json()).then(function(ps){
    var box=document.getElementById('posts');
    if(!ps.length){box.innerHTML='<div class="empty">No posts yet — write your first announcement above.</div>';return;}
    box.innerHTML=ps.map(function(p){
      return '<div class="post'+(p.is_pinned?' pinned':'')+'">'+
        '<div class="p-top"><span class="p-date">'+esc(p.created_at)+'</span>'+
        '<span class="badge '+(p.is_published?'b-on':'b-off')+'">'+(p.is_published?'Live':'Draft')+'</span>'+
        (p.is_pinned?'<span class="badge b-pin">Pinned</span>':'')+'</div>'+
        '<div class="p-body">'+esc(p.body)+'</div>'+
        (p.image_url?'<div class="p-img"><img src="'+esc(p.image_url)+'" alt=""></div>':'')+
        '<div class="p-foot"><span class="p-likes">♥ '+p.likes+' like'+(p.likes===1?'':'s')+'</span>'+
        '<div class="p-acts">'+
        '<button class="btn btn-g btn-sm" onclick="editPost('+p.id+')">Edit</button>'+
        '<button class="btn btn-g btn-sm" onclick="pinPost('+p.id+')">'+(p.is_pinned?'Unpin':'Pin')+'</button>'+
        '<button class="btn btn-g btn-sm" onclick="togglePost('+p.id+')">'+(p.is_published?'Hide':'Show')+'</button>'+
        '<button class="btn btn-d btn-sm" onclick="delPost('+p.id+')">Delete</button>'+
        '</div></div></div>';
    }).join('');
    window._posts=ps;
  });
}
function addPost(){
  var body=document.getElementById('p-body').value.trim();
  if(!body){msg('err','Write something first');return;}
  fetch('/admin/posts/add',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({
    body:body,image_url:document.getElementById('p-img').value.trim(),
    link_url:document.getElementById('p-link').value.trim(),
    is_published:document.getElementById('p-pub').checked,
    is_pinned:document.getElementById('p-pin').checked
  })}).then(r=>r.json()).then(function(d){
    if(d.success){msg('ok','Posted!');['p-body','p-img','p-link'].forEach(function(i){document.getElementById(i).value='';});
      document.getElementById('p-pin').checked=false;updateCount();load();}
    else msg('err',d.error||'Failed');
  });
}
function editPost(id){
  var p=(window._posts||[]).find(function(x){return x.id===id;});if(!p)return;
  var body=prompt('Edit post text:',p.body);
  if(body===null)return;
  if(!body.trim()){msg('err','Post text required');return;}
  fetch('/admin/posts/'+id+'/edit',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({body:body})}).then(r=>r.json()).then(function(d){
      if(d.success){msg('ok','Saved');load();}else msg('err',d.error||'Failed');});
}
function pinPost(id){fetch('/admin/posts/'+id+'/pin',{method:'POST'}).then(r=>r.json()).then(load);}
function togglePost(id){fetch('/admin/posts/'+id+'/toggle',{method:'POST'}).then(r=>r.json()).then(load);}
function delPost(id){if(!confirm('Delete this post? Its likes go too.'))return;
  fetch('/admin/posts/'+id+'/delete',{method:'POST'}).then(r=>r.json()).then(load);}
updateCount();load();
</script>
</body>
</html>
